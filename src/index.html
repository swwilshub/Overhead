<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overhead</title>
<meta name="description" content="Overhead is a 90s-style factory management sim. Lease a plant in an American city, buy machines, hire a crew, buy materials and sell what you make. Fully playable with a keyboard and a screen reader.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a control room. Status bar across the top, department rail on the left, work area beside it.
   Safety yellow is reserved for hazards and alerts; machine green is the one accent. */
:root {
  --bg: #e7ebe7; --panel: #f7f8f5; --panel-2: #eef1ed; --ink: #17201c; --muted: #4f5c55; --line: #bfc8c1;
  --accent: #2d684d; --accent-ink: #ffffff; --accent-soft: #d6e6dc;
  --hazard: #f2b71f; --hazard-ink: #1a1a1a;
  --good: #1d6f3a; --bad: #a8261d; --warn: #8a5a00; --info: #24527a;
  --floor: #d3d8d2; --floor-line: #c1c8c1; --wall: #5b665f;
  --lot-ground: #8f9592; --lot-vacant: #9aaa72;
  --focus: #1b5fd6; --bar: #17201c; --bar-ink: #e9eee9;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-other: #8a918c;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --scale: 1; --radius: 6px;
  --step--1: calc(0.84rem * var(--scale)); --step-0: calc(1rem * var(--scale)); --step-1: calc(1.2rem * var(--scale)); --step-2: calc(1.5rem * var(--scale)); --step-3: calc(2.1rem * var(--scale)); --step-4: calc(3.2rem * var(--scale));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1412; --panel: #171e1b; --panel-2: #1d2622; --ink: #e2e9e4; --muted: #9eaca4; --line: #313d37;
  --accent: #74c49a; --accent-ink: #0b1510; --accent-soft: #23392e;
  --hazard: #f2c230; --hazard-ink: #141414;
  --good: #6fd08f; --bad: #ff8f84; --warn: #f0b44c; --info: #8cc0f0;
  --floor: #2a312d; --floor-line: #343d38; --wall: #8b978f; --focus: #7fb0ff; --bar: #060908; --bar-ink: #e2e9e4; --lot-ground: #3a403d; --lot-vacant: #4c5a3a; --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-other: #6d756f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1412; --panel: #171e1b; --panel-2: #1d2622; --ink: #e2e9e4; --muted: #9eaca4; --line: #313d37;
  --accent: #74c49a; --accent-ink: #0b1510; --accent-soft: #23392e;
  --hazard: #f2c230; --hazard-ink: #141414;
  --good: #6fd08f; --bad: #ff8f84; --warn: #f0b44c; --info: #8cc0f0;
  --floor: #2a312d; --floor-line: #343d38; --wall: #8b978f; --focus: #7fb0ff; --bar: #060908; --bar-ink: #e2e9e4; --lot-ground: #3a403d; --lot-vacant: #4c5a3a; --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-other: #6d756f; color-scheme: dark; }
:root[data-contrast="high"] { --muted: var(--ink); --line: var(--ink); --floor-line: var(--muted); }
:root[data-scale="1"] { --scale: 1.15 } :root[data-scale="2"] { --scale: 1.3 } :root[data-scale="3"] { --scale: 1.5 }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5; margin: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.01em; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); text-transform: uppercase } h2 { font-size: var(--step-2); text-transform: uppercase } h3 { font-size: var(--step-1); }
p { margin: 0; max-width: 68ch }
a { color: var(--accent) }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* a comma heard but not seen, between a repeated button's text and its row (dom.js nameBy) */
.named-by > .nb::after { content: ""; content: "" / ","; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: var(--radius); }
.skip:focus { top: 8px }
.num, td.n, th.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
td.n, th.n { text-align: right }
.muted { color: var(--muted) }
.good { color: var(--good) } .bad { color: var(--bad) } .warn { color: var(--warn) }

/* buttons & inputs */
button, .btn { font: inherit; font-size: var(--step--1); font-weight: 700; color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 0.45em 0.85em; cursor: pointer; min-height: 2.4em; display: inline-flex; align-items: center; gap: 0.4em; text-decoration: none; }
button:hover { border-color: var(--accent) }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
button.danger { color: var(--bad); border-color: currentColor }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
button:disabled { opacity: 0.55; cursor: not-allowed }
button.link { background: none; border: none; padding: 0; min-height: 0; color: var(--accent); text-decoration: underline; font-weight: 400; font-size: inherit }
input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 0.4em 0.55em; min-height: 2.4em; max-width: 100% }
input[type="checkbox"], input[type="radio"] { min-height: 0; width: 1.15em; height: 1.15em; accent-color: var(--accent) }
label { font-weight: 700; font-size: var(--step--1) }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.stack { display: flex; flex-direction: column; gap: 12px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px }

/* app shell */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 8px 16px; background: var(--bar); color: var(--bar-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.status .brand { font-family: var(--font-display); font-weight: 800; font-size: var(--step-1); text-transform: uppercase; letter-spacing: 0.02em; display: flex; align-items: center; gap: 10px }
.status .brand .stripe { width: 22px; height: 22px; border-radius: 3px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 5px, var(--hazard-ink) 5px 10px); flex: none }
.status .clock { font-family: var(--font-mono); font-size: var(--step--1); line-height: 1.25 }
.status .figs { display: flex; gap: 16px; flex-wrap: wrap }
.status .fig { display: flex; flex-direction: column; line-height: 1.15 }
.status .fig span:first-child { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.8 }
.status .fig span:last-child { font-family: var(--font-mono); font-weight: 600 }
.status .run { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto }
.status .run button { background: transparent; color: var(--bar-ink); border-color: color-mix(in srgb, var(--bar-ink) 40%, transparent); }
.status .run button[aria-pressed="true"] { background: var(--hazard); color: var(--hazard-ink); border-color: var(--hazard) }
.status .alert { background: var(--hazard); color: var(--hazard-ink); border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: var(--step--1); border: none; min-height: 0 }
.body { display: grid; grid-template-columns: 210px 1fr; min-height: 0 }
nav.rail { background: var(--panel-2); border-right: 1px solid var(--line); padding: 12px 8px; overflow-y: auto; }
nav.rail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px }
nav.rail a { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: var(--radius); color: var(--ink); text-decoration: none; font-weight: 700 }
nav.rail a:hover { background: var(--panel) }
nav.rail a[aria-current="page"] { background: var(--accent); color: var(--accent-ink) }
nav.rail .badge { background: var(--hazard); color: var(--hazard-ink); border-radius: 999px; padding: 0 8px; font-size: 0.8rem; font-family: var(--font-mono) }
nav.rail .group { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 12px 10px 4px }
main { --pad-b: 60px; overflow: auto; padding-block: 20px var(--pad-b); padding-inline: 24px; min-width: 0; position: relative }
.view-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 16px }
.view-head p { color: var(--muted) }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0 }
section.card > h2, section.card > h3 { margin-bottom: 10px }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 0 }
.kv dt { color: var(--muted) } .kv dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.grid2.split-inbox { grid-template-columns: minmax(min(100%, 320px), 1fr) minmax(min(100%, 320px), 1.3fr); align-items: start }
.grid2.split-city { grid-template-columns: minmax(0, auto) minmax(min(100%, 300px), 1fr); align-items: start }
.grid2.split-nation { grid-template-columns: minmax(0, 2fr) minmax(min(100%, 300px), 1fr); align-items: start }
.table-wrap { overflow-x: auto; max-width: 100%; position: relative } /* positioned, so screen-reader-only text inside is clipped with the table instead of widening the page */
table { border-collapse: collapse; width: 100%; font-size: var(--step--1) }
caption { text-align: left; font-weight: 700; padding-bottom: 6px }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700 }
th button.sort { background: none; border: none; padding: 0; min-height: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit }
tr.you td { background: var(--accent-soft); font-weight: 700 }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 0.8rem; font-weight: 700; border: 1.5px solid currentColor; white-space: nowrap }
.pill.ok { color: var(--good) } .pill.bad { color: var(--bad) } .pill.warn { color: var(--warn) } .pill.info { color: var(--info) } .pill.mute { color: var(--muted) }
.meter { height: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; min-width: 60px }
.meter > i { display: block; height: 100%; background: var(--accent) }
.empty { padding: 24px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 10px }
.notice { border-left: 6px solid var(--hazard); background: var(--panel); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0 }
.memo-body { white-space: pre-line; max-width: 68ch }

/* dialogs */
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px) }
dialog::backdrop { background: rgb(0 0 0 / 0.45) }
dialog .dlg { padding: 20px; display: flex; flex-direction: column; gap: 14px }
dialog .dlg-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px }

/* toasts (visual only; announcements go to the live regions) */
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 40; max-width: min(380px, calc(100vw - 32px)); pointer-events: none }
.toast { background: var(--bar); color: var(--bar-ink); padding: 10px 14px; border-radius: 8px; font-size: var(--step--1); box-shadow: 0 6px 18px rgb(0 0 0 / 0.25) }
.toast.assertive { background: var(--hazard); color: var(--hazard-ink) }

/* floor */
.floor-help { font-size: var(--step--1); color: var(--muted) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid var(--line) }
/* pages that each fit the screen on a phone (spec 016) */
main.pager-main { padding: 0; overflow: hidden; position: relative }
.pager { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg) }
.pager-tabs { flex: none; display: flex; gap: 4px; padding: 6px 8px 0; overflow-x: auto; scrollbar-width: none; border-bottom: 2px solid var(--line) }
.pager-tabs::-webkit-scrollbar { display: none }
.pager.solo .pager-tabs { display: none }
.pager-tabs [role=tab] { flex: 1 1 0; min-width: max-content; min-height: 46px; padding: 4px 12px; border-radius: 10px 10px 0 0; border: 1px solid var(--line); border-bottom: 0; background: var(--panel-2); margin-bottom: -2px; font-weight: 700 }
.pager-tabs [role=tab][aria-selected=true] { background: var(--panel); border-color: var(--accent); border-bottom: 2px solid var(--panel); color: var(--accent) }
.pager-tabs .badge { margin-left: 6px; background: var(--hazard); color: var(--hazard-ink); border-radius: 999px; padding: 0 8px; font-size: 0.8rem; font-family: var(--font-mono) }
.pager-main { flex: 1; min-height: 0; display: flex; flex-direction: column }
.pager-view { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: pan-y; background: var(--bg) }
.pager-view.pending { visibility: hidden }
.pg-group { position: absolute; inset: 0; padding: 10px 12px; box-sizing: border-box; overflow: hidden }
.pg-group[hidden] { display: none }
.pg-group.overflowing { overflow-y: auto }
.pg-head { margin-bottom: 10px }
.pg-body { display: block }
.pg-body > * { margin: 0 0 10px }
.pg-body > .table-wrap { margin: 0 }
.pg-body [hidden] { display: none !important }
.pg-body > .table-wrap tr { margin-bottom: 10px }
.pager-bar { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 6px 12px; border-top: 1px solid var(--line); background: var(--panel-2) }
.pager-bar.single { display: none }
.pager-btn { min-height: 48px; font-weight: 700; font-size: 1.05rem }
.pager-count { min-width: 5em; text-align: center; font-weight: 700 }
@keyframes pg-in-l { from { transform: translateX(28px); opacity: 0.2 } to { transform: none; opacity: 1 } }
@keyframes pg-in-r { from { transform: translateX(-28px); opacity: 0.2 } to { transform: none; opacity: 1 } }
.pg-group.slide-l { animation: pg-in-l 0.16s ease-out } .pg-group.slide-r { animation: pg-in-r 0.16s ease-out }
/* a landscape phone has width and no height: a few tabs stand in a column at the left */
@media (max-height: 500px) {
  .pager:not(.many) { flex-direction: row }
  .pager:not(.many) .pager-tabs { flex-direction: column; width: 132px; overflow: visible; border-bottom: 0; border-right: 2px solid var(--line); padding: 8px 6px; gap: 6px }
  .pager:not(.many) .pager-tabs [role=tab] { flex: none; min-width: 0; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); margin: 0; padding: 4px 8px; text-align: left }
  .pager:not(.many) .pager-tabs [role=tab][aria-selected=true] { border-color: var(--accent); background: var(--panel) }
  /* the arrows move to the left and right edges of the page, where the thumbs are, and the count sits along the bottom */
  .pager-main { position: relative }
  .pager-bar { position: absolute; inset: 0; display: block; padding: 0; border: 0; background: none; pointer-events: none }
  .pager-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; min-width: 48px; height: 96px; padding: 0; font-size: 0; pointer-events: auto; border-radius: 12px; background: color-mix(in srgb, var(--panel) 92%, transparent) }
  .pager-btn [aria-hidden] { font-size: 2rem; line-height: 1 }
  .pager-btn[data-key="pg-prev"] { left: 6px } .pager-btn[data-key="pg-next"] { right: 6px }
  .pager-count { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); pointer-events: none; min-width: 0; padding: 0 10px; font-size: 0.85rem; border-radius: 999px; background: color-mix(in srgb, var(--panel) 90%, transparent) }
  .pager-tabs [role=tab] { min-height: 40px }
  .pg-body .pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 16px; align-items: start }
  .stepper:not(.compact) { grid-template-columns: auto minmax(8em, 1fr); align-items: center; gap: 4px 12px } .stepper:not(.compact) > .stepper-chips, .stepper:not(.compact) > .stepper-note, .stepper:not(.compact) > .stepper-main:only-child { grid-column: 1 / -1 }
  .stepper-main { grid-template-columns: auto auto; align-items: center } .stepper-value { min-width: 7ch; font-size: 1.2rem } .stepper-btn { min-width: 0; padding: 0 10px }
  .stepper-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none } .chip { flex: none }
  .pg-group { padding: 4px 62px 26px } .pager-tabs { padding-top: 4px } .pg-body .cat-item { padding: 8px 10px }
  .pg-body .chart-fig { gap: 2px } .pg-body .chart-fig figcaption h3 { font-size: 1rem } .pg-body .chart-readout { min-height: 0 } .pg-body .chart-legend { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none }
}
/* the factory floor is the whole content area (spec 015): one canvas, with the controls floating over it */
main.floor-main { padding: 0; overflow: hidden }
#live-polite, #live-assertive { position: fixed; top: 0; left: 0 }   /* off-screen text must not make the page taller */
html:has(main.floor-main), body:has(main.floor-main) { overflow: hidden; overscroll-behavior: none }   /* the page never scrolls or pulls to refresh under the floor */
.floor-stage { position: absolute; inset: 0; --sheet-h: 0px; overflow: hidden; background: var(--bg) }
.floor-surface { position: absolute; inset: 0; touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: default; -webkit-tap-highlight-color: transparent }
.floor-surface.panning { cursor: grabbing }
.floor-surface:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px }
.floor-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none }
.floor-hud { position: absolute; inset: 0; pointer-events: none; z-index: 2 }
.floor-hud > *, .floor-hud .hud-left > * { pointer-events: auto }
.floor-hud .hud-left { pointer-events: none }
.hud-left { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: calc(100% - 24px - 332px) }
.floor-tools, .site-tabs, .needs-card, .hud-chip, .hud-zoom, .hud-buttons, .place-bar { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 10px rgb(0 0 0 / 0.18); backdrop-filter: blur(4px) }
.floor-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; align-items: center }
.site-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px }
.needs-card { margin: 0; max-width: 460px; max-height: 40vh; overflow: auto; border-left: 6px solid var(--hazard) }
.needs-card summary { cursor: pointer; padding: 2px 0 }
.hud-panel { position: absolute; right: 12px; top: 12px; bottom: calc(12px + 56px); width: 320px; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 10px; padding: 8px; background: color-mix(in srgb, var(--bg) 94%, transparent); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 14px rgb(0 0 0 / 0.22); backdrop-filter: blur(4px) }
.hud-panel.away { display: none }
.hud-bottom { position: absolute; left: 12px; right: 12px; bottom: calc(12px + var(--sheet-h)); display: flex; flex-direction: column; align-items: flex-start; gap: 8px }
.hud-info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; max-width: calc(100% - 332px) }
.hud-chip { margin: 0; padding: 6px 10px; font-size: 0.85rem; color: var(--muted) }
.hud-buttons { gap: 6px; padding: 4px }
.hud-zoom { position: absolute; right: 12px; top: 12px; padding: 4px }
.hud-zoom .zoom-group { flex-direction: column } .hud-zoom .zoom-num { display: none }
.place-bar { position: static; width: 100%; max-width: 640px; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 12px; align-self: center; box-shadow: 0 -4px 16px rgb(0 0 0 / 0.2) }
.place-what { font-weight: 700 }
.place-bar button { min-height: 48px; min-width: 88px }
.zoom-group { display: inline-flex; align-items: center; gap: 6px }

/* city */
